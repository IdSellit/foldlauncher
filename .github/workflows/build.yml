          // ---------- Theme ----------

          val NeonCyan = Color(0xFF6CE6FF)
          val NeonViolet = Color(0xFFA78BFF)
          val Danger = Color(0xFFFF3B5C)
          val Ok = Color(0xFF3DDC84)
          val Slate = Color(0xFF8E93A6)

          // Frosted-glass surface: translucent gradient fill + bright rim light.
          fun Modifier.glass(shape: Shape, strength: Float = 1f): Modifier = this
              .clip(shape)
              .background(
                  Brush.linearGradient(
                      listOf(
                          Color.White.copy(alpha = 0.30f * strength),
                          Color.White.copy(alpha = 0.07f * strength)
                      )
                  )
              )
              .border(
                  1.dp,
                  Brush.linearGradient(
                      listOf(
                          Color.White.copy(alpha = 0.75f * strength),
                          NeonCyan.copy(alpha = 0.18f * strength),
                          NeonViolet.copy(alpha = 0.40f * strength)
                      )
                  ),
                  shape
              )

          // Light sweep across an icon (notification).
          fun Modifier.shineEffect(active: Boolean, progress: () -> Float): Modifier =
              if (!active) this else this.drawWithContent {
                  drawContent()
                  val w = this.size.width
                  val x = -0.6f * w + progress() * 1.6f * w
                  drawRect(
                      Brush.horizontalGradient(
                          listOf(Color.Transparent, Color.White.copy(alpha = 0.8f), Color.Transparent),
                          startX = x,
                          endX = x + 0.6f * w
                      )
                  )
              }

          // Pulsing green ring while a call is ringing (silent, visual only).
          fun Modifier.ringGlow(active: Boolean, progress: () -> Float): Modifier =
              if (!active) this else this.drawWithContent {
                  drawContent()
                  val a = 0.55f + 0.45f * sin(progress() * 2f * PI.toFloat())
                  val r = this.size.minDimension * 0.225f
                  drawRoundRect(
                      color = Ok,
                      alpha = a,
                      cornerRadius = CornerRadius(r, r),
                      style = Stroke(width = 3.dp.toPx())
                  )
              }

          fun ringRotation(t: Float): Float =
              if (t < 0.6f) sin(t / 0.6f * 8f * PI.toFloat()) * 14f else 0f

          // ---------- Activity ----------

          object AppEvents {
              var tick by mutableIntStateOf(0)
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  window.statusBarColor = android.graphics.Color.TRANSPARENT
                  window.navigationBarColor = android.graphics.Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= 29) window.isNavigationBarContrastEnforced = false
                  if (Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      window.attributes = lp
                  }
                  hideStatusBar()
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  setContent { Launcher() }
              }

              // The phone's own top bar is hidden; the launcher draws its own status icons.
              private fun hideStatusBar() {
                  val c = WindowInsetsControllerCompat(window, window.decorView)
                  c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  c.hide(WindowInsetsCompat.Type.statusBars())
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideStatusBar()
              }

              override fun onResume() {
                  super.onResume()
                  hideStatusBar()
                  NotifService.silenceRequested = true // opening the launcher silences the battery beep
                  AppEvents.tick++ // refresh app list (e.g. after an uninstall)
              }
          }

          // ---------- Data ----------

          data class AppItem(
              val label: String,
              val pkg: String,
              val icon: ImageBitmap,
              val folder: String,
              val removable: Boolean,
              val installed: Long
          )

          const val MAIN_COLS = 4
          const val COLS_N = 4
          const val COLS_W = 8
          const val ROWS_N_GUESS = 5
          const val ROWS_W_GUESS = 4

          // An app placed on a custom screen. Separate cells for folded (c,r) and unfolded (wc,wr) layouts.
          data class Placed(val pkg: String, val c: Int, val r: Int, val wc: Int, val wr: Int) {
              fun col(wide: Boolean) = if (wide) wc else c
              fun row(wide: Boolean) = if (wide) wr else r
              fun moved(wide: Boolean, col: Int, row: Int) =
                  if (wide) copy(wc = col, wr = row) else copy(c = col, r = row)
          }

          data class ScreenData(val name: String, val items: List<Placed>)

          fun nextFree(items: List<Placed>, wide: Boolean, columns: Int, rows: Int): Pair<Int, Int> {
              val used = items.map { it.col(wide) to it.row(wide) }.toSet()
              for (r in 0 until rows) {
                  for (c in 0 until columns) {
                      if ((c to r) !in used) return c to r
                  }
              }
              return 0 to 0
          }

          fun colsFor(idx: Int, wide: Boolean): Int =
              if (idx == 0) MAIN_COLS else if (wide) COLS_W else COLS_N

          data class RecentApp(val app: AppItem, val time: Long)

          data class MenuState(val app: AppItem, val anchor: Offset, val onRemove: (() -> Unit)?)

          data class WeatherInfo(val temp: String, val cond: String, val place: String, val hl: String)

          class WeatherState(private val prefs: SharedPreferences) {
              var city by mutableStateOf(prefs.getString("w_city", "") ?: "")
              var useF by mutableStateOf(prefs.getBoolean("w_f", true))
              var temp by mutableStateOf("—")
              var cond by mutableStateOf("")
              var place by mutableStateOf("")
              var hl by mutableStateOf("")

              fun update(newCity: String, f: Boolean) {
                  city = newCity.trim()
                  useF = f
                  prefs.edit().putString("w_city", city).putBoolean("w_f", f).apply()
              }
          }

          // Everything an icon needs to know, passed as one object.
          data class UiEnv(
              val counts: Map<String, Int>,
              val ringing: Set<String>,
              val editing: Boolean,
              val labels: Boolean,
              val shine: () -> Float,
              val wiggle: () -> Float,
              val ring: () -> Float,
              val onLaunch: (AppItem) -> Unit,
              val onMenu: (MenuState) -> Unit,
              val onRemove: ((AppItem) -> Unit)?
          )

          val FOLDERS = listOf("Work", "Entertainment", "Games", "Other")

          private val WORK_HINTS = listOf(
              "office", "slack", "teams", "zoom", "docs", "sheets", "slides", "drive", "calendar",
              "outlook", "notion", "trello", "excel", "powerpoint", "onedrive", "dropbox", "mail"
          )
          private val FUN_HINTS = listOf(
              "youtube", "netflix", "spotify", "tiktok", "instagram", "facebook", "twitch", "hulu",
              "disney", "music", "video", "snapchat", "reddit", "twitter", "pinterest", "prime"
          )

          fun folderFor(ai: ApplicationInfo, pkg: String): String {
              @Suppress("DEPRECATION")
              val isGame = ai.category == ApplicationInfo.CATEGORY_GAME ||
                  (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
              if (isGame) return "Games"
              when (ai.category) {
                  ApplicationInfo.CATEGORY_PRODUCTIVITY -> return "Work"
                  ApplicationInfo.CATEGORY_AUDIO,
                  ApplicationInfo.CATEGORY_VIDEO,
                  ApplicationInfo.CATEGORY_IMAGE,
                  ApplicationInfo.CATEGORY_SOCIAL,
                  ApplicationInfo.CATEGORY_NEWS -> return "Entertainment"
              }
              val p = pkg.lowercase()
              if (WORK_HINTS.any { p.contains(it) } || p.endsWith(".gm")) return "Work"
              if (FUN_HINTS.any { p.contains(it) }) return "Entertainment"
              return "Other"
          }

          private val iconCache = HashMap<String, ImageBitmap>()

          // Draws an app icon edge to edge (no system mask) so we can apply one squircle to every icon.
          fun iconBitmap(d: Drawable): Bitmap {
              val size = 192
              val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
              val c = AndroidCanvas(bmp)
              if (d is AdaptiveIconDrawable) {
                  val m = (size * 0.25f).toInt()
                  d.background?.let {
                      it.setBounds(-m, -m, size + m, size + m)
                      it.draw(c)
                  }
                  d.foreground?.let {
                      it.setBounds(-m, -m, size + m, size + m)
                      it.draw(c)
                  }
              } else {
                  d.setBounds(0, 0, size, size)
                  d.draw(c)
              }
              return bmp
          }

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(intent, 0)
                  .filter { it.activityInfo.packageName != ctx.packageName }
                  .distinctBy { it.activityInfo.packageName }
                  .map { ri ->
                      val pkg = ri.activityInfo.packageName
                      val ai = ri.activityInfo.applicationInfo
                      val system = (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0 &&
                          (ai.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0
                      AppItem(
                          ri.loadLabel(pm).toString(),
                          pkg,
                          iconCache.getOrPut(pkg) { iconBitmap(ri.loadIcon(pm)).asImageBitmap() },
                          folderFor(ai, pkg),
                          !system,
                          try { pm.getPackageInfo(pkg, 0).firstInstallTime } catch (e: Exception) { 0L }
                      )
                  }
                  .sortedBy { it.label.lowercase() }
          }

          fun defaultDock(ctx: Context, apps: List<AppItem>): List<AppItem> {
              val pm = ctx.packageManager
              val intents = listOf(
                  Intent(Intent.ACTION_DIAL),
                  Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:")),
                  Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")),
                  Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
              )
              val picked = intents
                  .mapNotNull { i -> pm.resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName }
                  .mapNotNull { p -> apps.find { it.pkg == p } }
                  .distinct()
              return (picked + apps.filter { it !in picked }).take(4)
          }

          fun loadScreens(prefs: SharedPreferences): List<ScreenData> {
              val raw = prefs.getString("screens", null) ?: return listOf(ScreenData("Home", emptyList()))
              return try {
                  val arr = JSONArray(raw)
                  (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      val items = ArrayList<Placed>()
                      val ia = o.optJSONArray("items")
                      if (ia != null) {
                          for (k in 0 until ia.length()) {
                              val it = ia.getJSONObject(k)
                              items.add(
                                  Placed(
                                      it.getString("p"), it.getInt("c"), it.getInt("r"),
                                      it.getInt("wc"), it.getInt("wr")
                                  )
                              )
                          }
                      } else {
                          val legacy = o.optJSONArray("apps")
                          if (legacy != null) {
                              for (k in 0 until legacy.length()) {
                                  items.add(Placed(legacy.getString(k), k % COLS_N, k / COLS_N, k % COLS_W, k / COLS_W))
                              }
                          }
                      }
                      ScreenData(o.getString("name"), items)
                  }
              } catch (e: Exception) {
                  listOf(ScreenData("Home", emptyList()))
              }
          }

          fun saveScreens(prefs: SharedPreferences, list: List<ScreenData>) {
              val arr = JSONArray()
              list.forEach { s ->
                  val items = JSONArray()
                  s.items.forEach { p ->
                      items.put(
                          JSONObject().put("p", p.pkg).put("c", p.c).put("r", p.r).put("wc", p.wc).put("wr", p.wr)
                      )
                  }
                  arr.put(JSONObject().put("name", s.name).put("items", items))
              }
              prefs.edit().putString("screens", arr.toString()).apply()
          }

          fun isListenerOn(ctx: Context): Boolean =
              NotificationManagerCompat.getEnabledListenerPackages(ctx).contains(ctx.packageName)

          fun pullShade(ctx: Context, quickSettings: Boolean) {
              val svc = ShadeService.instance
              if (svc == null) {
                  ctx.startActivity(
                      Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
                  return
              }
              svc.performGlobalAction(
                  if (quickSettings) AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS
                  else AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS
              )
          }

          // ---------- Weather (Open-Meteo, free, no key) ----------

          fun httpGet(url: String): String {
              val c = URL(url).openConnection() as HttpURLConnection
              c.connectTimeout = 8000
              c.readTimeout = 8000
              return try {
                  c.inputStream.bufferedReader().use { it.readText() }
              } finally {
                  c.disconnect()
              }
          }

          fun weatherText(code: Int): String = when (code) {
              0 -> "Clear"
              1, 2 -> "Mostly clear"
              3 -> "Cloudy"
              45, 48 -> "Fog"
              in 51..57 -> "Drizzle"
              in 61..67 -> "Rain"
              in 71..77 -> "Snow"
              in 80..82 -> "Showers"
              85, 86 -> "Snow showers"
              in 95..99 -> "Thunderstorm"
              else -> "—"
          }

          fun fetchWeather(city: String, f: Boolean): WeatherInfo {
              val q = URLEncoder.encode(city, "UTF-8")
              val geo = JSONObject(httpGet("https://geocoding-api.open-meteo.com/v1/search?name=$q&count=1"))
              val results = geo.optJSONArray("results") ?: return WeatherInfo("—", "City not found", city, "")
              val first = results.getJSONObject(0)
              val lat = first.getDouble("latitude")
              val lon = first.getDouble("longitude")
              val unit = if (f) "fahrenheit" else "celsius"
              val w = JSONObject(
                  httpGet(
                      "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon" +
                          "&current=temperature_2m,weather_code" +
                          "&daily=temperature_2m_max,temperature_2m_min&forecast_days=1" +
                          "&temperature_unit=$unit"
                  )
              )
              val cur = w.getJSONObject("current")
              val t = cur.getDouble("temperature_2m").roundToInt()
              val hl = try {
                  val d = w.getJSONObject("daily")
                  "H:" + d.getJSONArray("temperature_2m_max").getDouble(0).roundToInt() + "° " +
                      "L:" + d.getJSONArray("temperature_2m_min").getDouble(0).roundToInt() + "°"
              } catch (e: Exception) {
                  ""
              }
              return WeatherInfo(
                  "$t°",
                  weatherText(cur.getInt("weather_code")),
                  first.optString("name", city),
                  hl
              )
          }

          // ---------- Recent apps (usage access) ----------

          fun hasUsageAccess(ctx: Context): Boolean {
              val ops = ctx.getSystemService(AppOpsManager::class.java)
              @Suppress("DEPRECATION")
              val mode = ops.checkOpNoThrow(
                  AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), ctx.packageName
              )
              return mode == AppOpsManager.MODE_ALLOWED
          }

          fun recentApps(ctx: Context, apps: List<AppItem>): List<RecentApp> {
              return try {
                  val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                  val now = System.currentTimeMillis()
                  val events = usm.queryEvents(now - 24L * 3600_000L, now)
                  val last = HashMap<String, Long>()
                  val e = UsageEvents.Event()
                  while (events.hasNextEvent()) {
                      events.getNextEvent(e)
                      if (e.eventType == UsageEvents.Event.ACTIVITY_RESUMED) last[e.packageName] = e.timeStamp
                  }
                  val byPkg = apps.associateBy { it.pkg }
                  last.entries
                      .mapNotNull { (pkg, t) -> byPkg[pkg]?.let { RecentApp(it, t) } }
                      .sortedByDescending { it.time }
                      .take(12)
              } catch (e: Exception) {
                  emptyList()
              }
          }

          // ---------- Root ----------

          @Composable
          fun Launcher() {
              val ctx = LocalContext.current
              val haptic = LocalHapticFeedback.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("fold", Context.MODE_PRIVATE) }

              val tick = AppEvents.tick
              val apps = remember(tick) { loadApps(ctx) }
              val dock = remember(apps) { defaultDock(ctx, apps) }
              val folders = remember(apps) { FOLDERS.associateWith { n -> apps.filter { it.folder == n } } }
              val counts = remember {
                  mutableStateMapOf<String, Int>().apply {
                      apps.forEach { a ->
                          val c = prefs.getInt("c_${a.pkg}", 0)
                          if (c > 0) put(a.pkg, c)
                      }
                  }
              }
              // screens[0] is the Home screen (widgets + apps). The App Library is always the last page.
              val screens = remember {
                  mutableStateListOf<ScreenData>().apply {
                      val loaded = loadScreens(prefs)
                      addAll(if (loaded.isEmpty()) listOf(ScreenData("Home", emptyList())) else loaded)
                      if (!prefs.getBoolean("seeded", false)) {
                          val dockPkgs = dock.map { it.pkg }.toSet()
                          val seed = apps.filter { it.pkg !in dockPkgs }.take(16)
                          this[0] = this[0].copy(
                              items = seed.mapIndexed { i, a ->
                                  Placed(a.pkg, i % MAIN_COLS, i / MAIN_COLS, i % MAIN_COLS, i / MAIN_COLS)
                              }
                          )
                          prefs.edit().putBoolean("seeded", true).apply()
                          saveScreens(prefs, this)
                      }
                  }
              }
              val weather = remember { WeatherState(prefs) }
              val dismissedAt = remember { mutableStateMapOf<String, Long>() }

              val wide = LocalConfiguration.current.screenWidthDp >= 600
              val columns = if (wide) COLS_W else COLS_N
              var iconScale by remember { mutableIntStateOf(prefs.getInt("icon_scale", 1)) }
              var showLabels by remember { mutableStateOf(prefs.getBoolean("labels", false)) }
              val iconSize = (if (wide) 60.dp else 48.dp) * listOf(0.8f, 1f, 1.25f)[iconScale]

              var editing by remember { mutableStateOf(false) }
              var openFolder by remember { mutableStateOf<String?>(null) }
              var pickerFor by remember { mutableStateOf<Int?>(null) }
              var weatherEditing by remember { mutableStateOf(false) }
              var menu by remember { mutableStateOf<MenuState?>(null) }
              var gridRows by remember { mutableIntStateOf(ROWS_N_GUESS) }
              var showRecents by remember { mutableStateOf(false) }
              var lastSwipe by remember { mutableLongStateOf(0L) }

              BackHandler(editing) { editing = false }
              BackHandler(openFolder != null) { openFolder = null }
              BackHandler(pickerFor != null) { pickerFor = null }
              BackHandler(weatherEditing) { weatherEditing = false }
              BackHandler(menu != null) { menu = null }
              BackHandler(showRecents) { showRecents = false }

              // Shared animations (only read at draw time, so no constant recomposition).
              val inf = rememberInfiniteTransition(label = "fx")
              val shineAnim = inf.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      keyframes {
                          durationMillis = 2000
                          0f at 0 using LinearEasing
                          1f at 700
                      }
                  ),
                  label = "shine"
              )
              val wiggleAnim = inf.animateFloat(
                  initialValue = -1f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(120, easing = LinearEasing), RepeatMode.Reverse),
                  label = "wiggle"
              )
              val ringAnim = inf.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(1400, easing = LinearEasing)),
                  label = "ring"
              )

              LaunchedEffect(weather.city, weather.useF) {
                  if (weather.city.isBlank()) {
                      weather.temp = "—"
                      weather.cond = "Tap to set city"
                      weather.place = ""
                      weather.hl = ""
                      return@LaunchedEffect
                  }
                  while (true) {
                      try {
                          val r = withContext(Dispatchers.IO) { fetchWeather(weather.city, weather.useF) }
                          weather.temp = r.temp
                          weather.cond = r.cond
                          weather.place = r.place
                          weather.hl = r.hl
                      } catch (e: Exception) {
                          weather.cond = "Weather unavailable"
                      }
                      delay(30 * 60 * 1000L)
                  }
              }

              LaunchedEffect(apps) {
                  val pkgs = apps.map { it.pkg }.toSet()
                  var changed = false
                  for (i in screens.indices) {
                      val sc = screens[i]
                      val kept = sc.items.filter { it.pkg in pkgs }
                      if (kept.size != sc.items.size) {
                          screens[i] = sc.copy(items = kept)
                          changed = true
                      }
                  }
                  if (changed) saveScreens(prefs, screens)
              }

              var listenerOn by remember { mutableStateOf(isListenerOn(ctx)) }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(2000)
                      listenerOn = isListenerOn(ctx)
                  }
              }

              val ui = UiEnv(
                  counts = NotifState.counts,
                  ringing = NotifState.ringing,
                  editing = editing,
                  labels = showLabels,
                  shine = { shineAnim.value },
                  wiggle = { wiggleAnim.value },
                  ring = { ringAnim.value },
                  onLaunch = { a ->
                      val n = (counts[a.pkg] ?: 0) + 1
                      counts[a.pkg] = n
                      prefs.edit().putInt("c_${a.pkg}", n).apply()
                      ctx.packageManager.getLaunchIntentForPackage(a.pkg)?.let { ctx.startActivity(it) }
                  },
                  onMenu = { m ->
                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                      menu = m
                  },
                  onRemove = null
              )

              val ranked = apps.sortedByDescending { counts[it.pkg] ?: 0 }
              val recent = remember(apps) { apps.sortedByDescending { it.installed }.take(12) }
              val cards = listOf("Suggestions" to ranked.take(12), "Recently Added" to recent) +
                  FOLDERS.map { it to folders[it].orEmpty() }
              val pager = rememberPagerState { screens.size + 1 }

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0x66000A1E), Color(0x1A000000), Color(0x8C000A1E))
                          )
                      )
                      .drawBehind {
                          drawRect(
                              Brush.radialGradient(
                                  listOf(NeonCyan.copy(alpha = 0.16f), Color.Transparent),
                                  center = Offset(0f, 0f),
                                  radius = size.maxDimension * 0.7f
                              )
                          )
                          drawRect(
                              Brush.radialGradient(
                                  listOf(NeonViolet.copy(alpha = 0.18f), Color.Transparent),
                                  center = Offset(size.width, size.height),
                                  radius = size.maxDimension * 0.7f
                              )
                          )
                      }
              ) {
                  val maxW = constraints.maxWidth.toFloat()
                  val maxH = constraints.maxHeight.toFloat()

                  Row(
                      Modifier
                          .fillMaxSize()
                          .systemBarsPadding()
                          .imePadding()
                          .padding(start = 14.dp, end = 14.dp, top = 8.dp, bottom = 2.dp)
                  ) {
                      Column(Modifier.weight(1f).fillMaxHeight()) {
                          StatusCluster(Modifier.padding(bottom = 8.dp))
                          if (!listenerOn) {
                              GlassPill("Tap to turn on notification badges") {
                                  ctx.startActivity(
                                      Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  )
                              }
                              Spacer(Modifier.height(6.dp))
                          }
                          if (editing) {
                              val cur = pager.currentPage
                              Row(
                                  Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  GlassPill("Done", selected = true) { editing = false }
                                  if (cur < screens.size) GlassPill("+ Apps") { pickerFor = cur }
                                  GlassPill("+ Screen") {
                                      screens.add(ScreenData("Screen ${screens.size}", emptyList()))
                                      saveScreens(prefs, screens)
                                      scope.launch {
                                          delay(150)
                                          pager.animateScrollToPage(screens.size - 1)
                                      }
                                  }
                                  if (cur in 1 until screens.size) {
                                      GlassPill("Delete screen") {
                                          screens.removeAt(cur)
                                          saveScreens(prefs, screens)
                                      }
                                  }
                                  Text("Icons", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                                  listOf("S", "M", "L").forEachIndexed { i, label ->
                                      GlassPill(label, selected = iconScale == i) {
                                          iconScale = i
                                          prefs.edit().putInt("icon_scale", i).apply()
                                      }
                                  }
                                  GlassPill(if (showLabels) "Labels: on" else "Labels: off") {
                                      showLabels = !showLabels
                                      prefs.edit().putBoolean("labels", showLabels).apply()
                                  }
                              }
                              Spacer(Modifier.height(6.dp))
                          }
                          HorizontalPager(pager, Modifier.weight(1f)) { page ->
                              if (page < screens.size) {
                                  val idx = page
                                  val sc = screens.getOrNull(idx)
                                  if (sc != null) {
                                      val move: (String, Int, Int) -> Unit = { pkg, col, row ->
                                          if (idx in screens.indices) {
                                              val cur = screens[idx]
                                              val me = cur.items.find { it.pkg == pkg }
                                              if (me != null) {
                                                  val other = cur.items.find {
                                                      it.pkg != pkg && it.col(wide) == col && it.row(wide) == row
                                                  }
                                                  val oldC = me.col(wide)
                                                  val oldR = me.row(wide)
                                                  screens[idx] = cur.copy(
                                                      items = cur.items.map { p ->
                                                          when {
                                                              p.pkg == pkg -> p.moved(wide, col, row)
                                                              other != null && p.pkg == other.pkg -> p.moved(wide, oldC, oldR)
                                                              else -> p
                                                          }
                                                      }
                                                  )
                                                  saveScreens(prefs, screens)
                                              }
                                          }
                                      }
                                      // "Remove from screen" only unpins the app; it is never uninstalled.
                                      val removeApp: (AppItem) -> Unit = { a ->
                                          if (idx in screens.indices) {
                                              screens[idx] = screens[idx].copy(
                                                  items = screens[idx].items.filter { it.pkg != a.pkg }
                                              )
                                              saveScreens(prefs, screens)
                                          }
                                      }
                                      if (idx == 0) {
                                          MainScreen(
                                              sc, apps, wide, iconSize, ui, weather,
                                              onEditWeather = { weatherEditing = true },
                                              prefs = prefs, onMove = move, onRemoveApp = removeApp,
                                              onRows = { gridRows = it }
                                          )
                                      } else {
                                          ScreenPage(
                                              sc, apps, wide, columns, iconSize, ui,
                                              onMove = move, onRemoveApp = removeApp,
                                              onRows = { gridRows = it }, onAdd = { pickerFor = idx }
                                          )
                                      }
                                  }
                              } else {
                                  LibraryPage(cards, apps, wide, columns, iconSize, ui) { openFolder = it }
                              }
                          }
                          Row(
                              Modifier.fillMaxWidth().padding(top = 4.dp),
                              horizontalArrangement = Arrangement.Center
                          ) {
                              repeat(screens.size + 1) { i ->
                                  Box(
                                      Modifier
                                          .padding(3.dp)
                                          .size(7.dp)
                                          .clip(CircleShape)
                                          .background(
                                              if (pager.currentPage == i) NeonCyan
                                              else Color.White.copy(alpha = 0.35f)
                                          )
                                  )
                              }
                          }
                          // Swipe up twice here to see running apps.
                          Box(
                              Modifier
                                  .fillMaxWidth()
                                  .height(40.dp)
                                  .pointerInput(Unit) {
                                      var total = 0f
                                      detectVerticalDragGestures(
                                          onDragStart = { total = 0f },
                                          onDragEnd = {
                                              if (total < -40.dp.toPx()) {
                                                  val now = System.currentTimeMillis()
                                                  if (now - lastSwipe < 900) {
                                                      lastSwipe = 0L
                                                      showRecents = true
                                                  } else {
                                                      lastSwipe = now
                                                  }
                                              }
                                          }
                                      ) { change, dy ->
                                          change.consume()
                                          total += dy
                                      }
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Box(
                                  Modifier
                                      .width(110.dp)
                                      .height(5.dp)
                                      .clip(CircleShape)
                                      .background(Color.White.copy(alpha = 0.55f))
                              )
                          }
                      }
                      Spacer(Modifier.width(10.dp))
                      SideDock(dock, if (wide) 54.dp else 42.dp, ui)
                  }

                  // Search button (opens the App Library page), bottom right like iOS.
                  Box(
                      Modifier
                          .align(Alignment.BottomEnd)
                          .navigationBarsPadding()
                          .padding(end = 14.dp, bottom = 52.dp)
                          .size(46.dp)
                          .glass(CircleShape)
                          .clickable { scope.launch { pager.animateScrollToPage(screens.size) } },
                      contentAlignment = Alignment.Center
                  ) { Text("🔍", fontSize = 18.sp) }

                  FloatingButton(maxW, maxH, prefs, "b", "🔔", false, 0)
                  FloatingButton(maxW, maxH, prefs, "w", "🛠️", true, 1)

                  openFolder?.let { name ->
                      FolderOverlay(name, cards.find { it.first == name }?.second.orEmpty(), wide, ui) {
                          openFolder = null
                      }
                  }
                  pickerFor?.let { idx ->
                      val sc = screens.getOrNull(idx)
                      if (sc != null) {
                          AppPicker(
                              "Add to ${sc.name}", apps, sc.items.map { it.pkg },
                              onToggle = { a ->
                                  val cur = screens[idx]
                                  val has = cur.items.any { it.pkg == a.pkg }
                                  val items = if (has) {
                                      cur.items.filter { it.pkg != a.pkg }
                                  } else {
                                      val n = nextFree(
                                          cur.items, false, colsFor(idx, false),
                                          if (wide) ROWS_N_GUESS else gridRows
                                      )
                                      val w = nextFree(
                                          cur.items, true, colsFor(idx, true),
                                          if (wide) gridRows else ROWS_W_GUESS
                                      )
                                      cur.items + Placed(a.pkg, n.first, n.second, w.first, w.second)
                                  }
                                  screens[idx] = cur.copy(items = items)
                                  saveScreens(prefs, screens)
                              },
                              onClose = { pickerFor = null }
                          )
                      }
                  }
                  if (weatherEditing) {
                      WeatherEditor(weather) { weatherEditing = false }
                  }
                  menu?.let { m ->
                      AppMenu(
                          m, maxW, maxH,
                          onDismiss = { menu = null },
                          onEdit = { editing = true },
                          onUninstall = { a ->
                              ctx.startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:${a.pkg}")))
                          }
                      )
                  }
                  if (showRecents) {
                      RecentsOverlay(
                          ctx, apps, dismissedAt,
                          onOpen = { a ->
                              showRecents = false
                              ui.onLaunch(a)
                          },
                          onClose = { showRecents = false }
                      )
                  }
              }
          }


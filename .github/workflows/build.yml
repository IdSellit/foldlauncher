          // Draggable bell: tap = notifications, long-press = quick settings, drag = move.
          @Composable
          fun ShadeButton(maxW: Float, maxH: Float, prefs: SharedPreferences) {
              val ctx = LocalContext.current
              val d = LocalDensity.current
              val sizePx = with(d) { 52.dp.toPx() }
              val defX = maxW - sizePx - with(d) { 16.dp.toPx() }
              val defY = maxH - sizePx - with(d) { 140.dp.toPx() }
              var x by remember { mutableFloatStateOf(prefs.getFloat("bx", defX)) }
              var y by remember { mutableFloatStateOf(prefs.getFloat("by", defY)) }

              Box(
                  Modifier
                      .offset { IntOffset(x.roundToInt(), y.roundToInt()) }
                      .size(52.dp)
                      .glass(CircleShape)
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onTap = { pullShade(ctx, false) },
                              onLongPress = { pullShade(ctx, true) }
                          )
                      }
                      .pointerInput(maxW, maxH) {
                          detectDragGestures(
                              onDragEnd = { prefs.edit().putFloat("bx", x).putFloat("by", y).apply() }
                          ) { change, drag ->
                              change.consume()
                              x = (x + drag.x).coerceIn(0f, maxW - sizePx)
                              y = (y + drag.y).coerceIn(0f, maxH - sizePx)
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Text("🔔", fontSize = 20.sp)
              }
          }

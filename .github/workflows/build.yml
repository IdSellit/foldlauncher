          // Cells you can drop apps into. Icon size shrinks if a cell is too narrow.
          @Composable
          fun PlacedGrid(
              screen: ScreenData, apps: List<AppItem>, wide: Boolean, columns: Int, iconSize: Dp, ui: UiEnv,
              onMove: (String, Int, Int) -> Unit, onRows: (Int) -> Unit, modifier: Modifier = Modifier
          ) {
              BoxWithConstraints(modifier) {
                  val cellW = maxWidth / columns
                  val tile = minOf(iconSize, cellW - 12.dp)
                  val cellH = tile + (if (ui.labels) 40.dp else 20.dp)
                  val rows = maxOf(1, (maxHeight / cellH).toInt())
                  LaunchedEffect(rows) { onRows(rows) }
                  if (screen.items.isEmpty()) {
                      Text(
                          "Long-press an app and choose Edit Home Screen, then tap + Apps",
                          color = Color.White.copy(alpha = 0.6f),
                          fontSize = 13.sp,
                          modifier = Modifier.align(Alignment.Center).padding(24.dp)
                      )
                  }
                  screen.items.forEach { p ->
                      val app = apps.find { it.pkg == p.pkg }
                      if (app != null) {
                          key(p.pkg) {
                              PlacedApp(app, p, wide, cellW, cellH, columns, rows, tile, ui, onMove)
                          }
                      }
                  }
              }
          }

          // An app sitting in a cell; in edit mode it can be dragged to any other cell.
          @Composable
          fun PlacedApp(
              app: AppItem, p: Placed, wide: Boolean, cellW: Dp, cellH: Dp,
              columns: Int, rows: Int, iconSize: Dp, ui: UiEnv,
              onMove: (String, Int, Int) -> Unit
          ) {
              val d = LocalDensity.current
              var dx by remember { mutableFloatStateOf(0f) }
              var dy by remember { mutableFloatStateOf(0f) }
              var dragging by remember { mutableStateOf(false) }
              val col = p.col(wide).coerceIn(0, columns - 1)
              val row = p.row(wide).coerceIn(0, rows - 1)
              val cw = with(d) { cellW.toPx() }
              val ch = with(d) { cellH.toPx() }

              Box(
                  Modifier
                      .offset { IntOffset((col * cw + dx).roundToInt(), (row * ch + dy).roundToInt()) }
                      .size(cellW, cellH)
                      .zIndex(if (dragging) 10f else 0f)
                      .then(
                          if (ui.editing) {
                              Modifier.pointerInput(p.pkg, col, row, cw, ch) {
                                  detectDragGestures(
                                      onDragStart = { dragging = true },
                                      onDragEnd = {
                                          val nc = ((col * cw + dx + cw / 2f) / cw).toInt().coerceIn(0, columns - 1)
                                          val nr = ((row * ch + dy + ch / 2f) / ch).toInt().coerceIn(0, rows - 1)
                                          dx = 0f
                                          dy = 0f
                                          dragging = false
                                          onMove(p.pkg, nc, nr)
                                      },
                                      onDragCancel = {
                                          dx = 0f
                                          dy = 0f
                                          dragging = false
                                      }
                                  ) { change, drag ->
                                      change.consume()
                                      dx += drag.x
                                      dy += drag.y
                                  }
                              }
                          } else Modifier
                      ),
                  contentAlignment = Alignment.TopCenter
              ) {
                  AppIcon(app, iconSize, ui)
              }
          }

          @Composable
          fun LibraryPage(
              cards: List<Pair<String, List<AppItem>>>, apps: List<AppItem>, wide: Boolean,
              columns: Int, iconSize: Dp, ui: UiEnv, onOpen: (String) -> Unit
          ) {
              var query by remember { mutableStateOf("") }
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier
                          .fillMaxWidth()
                          .glass(RoundedCornerShape(50))
                          .padding(horizontal = 16.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {

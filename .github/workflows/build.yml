                      ) {
                          WeatherWidget(weather, onEditWeather, Modifier.weight(1f).fillMaxHeight())
                          NowWidget(Modifier.weight(1f).fillMaxHeight())
                      }
                      Spacer(Modifier.height(8.dp))
                      PlacedGrid(
                          screen, apps, wide, MAIN_COLS, iconSize, env, onMove, onRows,
                          Modifier.weight(1f).fillMaxWidth()
                      )
                  }
              }
          }

          @Composable
          fun ScreenPage(
              screen: ScreenData, apps: List<AppItem>, wide: Boolean, columns: Int, iconSize: Dp, ui: UiEnv,
              onMove: (String, Int, Int) -> Unit, onRemoveApp: (AppItem) -> Unit, onRows: (Int) -> Unit,
              onAdd: () -> Unit

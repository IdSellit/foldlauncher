name: Build FoldLauncher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/foldlauncher
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldLauncher"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.foldlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="FoldLauncher"
                  android:theme="@android:style/Theme.DeviceDefault.Wallpaper.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|density|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/example/foldlauncher/MainActivity.kt <<'EOF_FILE'
          package com.example.foldlauncher

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.border
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ColorFilter
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Launcher() }
              }
          }

          data class AppItem(val label: String, val pkg: String, val icon: ImageBitmap)

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(intent, 0)
                  .map {
                      AppItem(
                          it.loadLabel(pm).toString(),
                          it.activityInfo.packageName,
                          it.loadIcon(pm).toBitmap(192, 192).asImageBitmap()
                      )
                  }
                  .sortedBy { it.label.lowercase() }
          }

          @Composable
          fun Launcher() {
              val ctx = LocalContext.current
              val apps = remember { loadApps(ctx) }

              // Recomposes automatically when you fold or unfold.
              val wide = LocalConfiguration.current.screenWidthDp >= 600
              val columns = if (wide) 8 else 4
              val iconSize = if (wide) 68.dp else 52.dp
              val dockApps = apps.take(4)

              Row(
                  Modifier
                      .fillMaxSize()
                      .systemBarsPadding()
                      .padding(horizontal = 16.dp, vertical = 8.dp)
              ) {
                  Column(Modifier.weight(1f).fillMaxHeight()) {
                      if (wide) {
                          Row(Modifier.weight(1f), horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                              WidgetStack(Modifier.weight(0.32f).fillMaxHeight())
                              AppGrid(apps, columns, iconSize, Modifier.weight(0.68f).fillMaxHeight())
                          }
                      } else {
                          WidgetStack(Modifier.fillMaxWidth().height(120.dp))
                          Spacer(Modifier.height(12.dp))
                          AppGrid(apps, columns, iconSize, Modifier.weight(1f))
                      }
                  }
                  Spacer(Modifier.width(12.dp))
                  SideDock(dockApps, if (wide) 56.dp else 44.dp)
              }
          }

          @Composable
          fun AppGrid(apps: List<AppItem>, columns: Int, iconSize: Dp, modifier: Modifier) {
              val ctx = LocalContext.current
              LazyVerticalGrid(
                  columns = GridCells.Fixed(columns),
                  modifier = modifier,
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  items(apps, key = { it.pkg }) { app ->
                      Column(
                          Modifier.clickable { launch(ctx, app.pkg) },
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Image(app.icon, app.label, Modifier.size(iconSize).clip(RoundedCornerShape(iconSize * 0.26f)))
                          Spacer(Modifier.height(4.dp))
                          Text(app.label, color = Color.White, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                  }
              }
          }

          @Composable
          fun SideDock(apps: List<AppItem>, size: Dp) {
              val ctx = LocalContext.current
              Box(Modifier.fillMaxHeight(), contentAlignment = Alignment.CenterEnd) {
                  Column(
                      Modifier
                          .clip(RoundedCornerShape(28.dp))
                          .border(1.dp, Color.White.copy(alpha = 0.35f), RoundedCornerShape(28.dp))
                          .padding(8.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      apps.forEach { app ->
                          val shape = RoundedCornerShape(size * 0.28f)
                          Box(
                              Modifier
                                  .size(size)
                                  .border(1.5.dp, Color.White, shape)
                                  .clip(shape)
                                  .clickable { launch(ctx, app.pkg) }
                                  .padding(size * 0.2f),
                              contentAlignment = Alignment.Center
                          ) {
                              Image(
                                  app.icon, app.label,
                                  Modifier.fillMaxSize(),
                                  colorFilter = ColorFilter.tint(Color.White)
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun WidgetStack(modifier: Modifier) {
              // Placeholder cards. Real widgets need AppWidgetHost (next step).
              val pager = rememberPagerState { 3 }
              val titles = listOf("Weather", "Calendar", "Notes")
              HorizontalPager(pager, modifier) { page ->
                  Box(
                      Modifier
                          .fillMaxSize()
                          .padding(horizontal = 4.dp)
                          .clip(RoundedCornerShape(24.dp))
                          .background(Color.White.copy(alpha = 0.2f))
                          .padding(16.dp),
                      contentAlignment = Alignment.CenterStart
                  ) {
                      Text(titles[page], color = Color.White, fontSize = 18.sp)
                  }
              }
          }

          private fun launch(ctx: Context, pkg: String) {
              ctx.packageManager.getLaunchIntentForPackage(pkg)?.let { ctx.startActivity(it) }
          }
          EOF_FILE

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoldLauncher.apk
          gh release create "build-${{ github.run_number }}" FoldLauncher.apk --title "FoldLauncher build ${{ github.run_number }}" --notes "Debug build"

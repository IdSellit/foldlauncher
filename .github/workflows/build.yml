name: Build FoldLauncher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/foldlauncher app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldLauncher"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.foldlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.foldlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="smsto" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.media.action.STILL_IMAGE_CAMERA" />
                  </intent>
              </queries>

              <application
                  android:label="FoldLauncher"
                  android:theme="@android:style/Theme.DeviceDefault.Wallpaper.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:resizeableActivity="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|density|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="FoldLauncher notifications"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".ShadeService"
                      android:exported="true"
                      android:label="FoldLauncher notification button"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/shade_desc"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100" />
          EOF_FILE
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="shade_desc">Lets the launcher button open your notifications and quick settings.</string>
          </resources>
          EOF_FILE
          cat > app/src/main/java/com/example/foldlauncher/MainActivity.kt <<'EOF_FILE'
          package com.example.foldlauncher

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.VerticalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.drawBehind
          import androidx.compose.ui.draw.drawWithContent
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ColorFilter
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.Shape
          import androidx.compose.ui.graphics.SolidColor
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalHapticFeedback
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.PI
          import kotlin.math.roundToInt
          import kotlin.math.sin

          // ---------- Theme ----------

          val NeonCyan = Color(0xFF6CE6FF)
          val NeonViolet = Color(0xFFA78BFF)
          val Danger = Color(0xFFFF3B5C)
          val Ok = Color(0xFF3DDC84)
          val Slate = Color(0xFF8E93A6)

          // Frosted-glass surface: translucent gradient fill + bright rim light.
          fun Modifier.glass(shape: Shape, strength: Float = 1f): Modifier = this
              .clip(shape)
              .background(
                  Brush.linearGradient(
                      listOf(
                          Color.White.copy(alpha = 0.30f * strength),
                          Color.White.copy(alpha = 0.07f * strength)
                      )
                  )
              )
              .border(
                  1.dp,
                  Brush.linearGradient(
                      listOf(
                          Color.White.copy(alpha = 0.75f * strength),
                          NeonCyan.copy(alpha = 0.18f * strength),
                          NeonViolet.copy(alpha = 0.40f * strength)
                      )
                  ),
                  shape
              )

          // Light sweep across an icon (notification).
          fun Modifier.shineEffect(active: Boolean, progress: () -> Float): Modifier =
              if (!active) this else this.drawWithContent {
                  drawContent()
                  val w = this.size.width
                  val x = -0.6f * w + progress() * 1.6f * w
                  drawRect(
                      Brush.horizontalGradient(
                          listOf(Color.Transparent, Color.White.copy(alpha = 0.8f), Color.Transparent),
                          startX = x,
                          endX = x + 0.6f * w
                      )
                  )
              }

          // Pulsing green ring while a call is ringing (silent, visual only).
          fun Modifier.ringGlow(active: Boolean, progress: () -> Float): Modifier =
              if (!active) this else this.drawWithContent {
                  drawContent()
                  val a = 0.55f + 0.45f * sin(progress() * 2f * PI.toFloat())
                  val r = this.size.minDimension * 0.3f
                  drawRoundRect(
                      color = Ok,
                      alpha = a,
                      cornerRadius = CornerRadius(r, r),
                      style = Stroke(width = 3.dp.toPx())
                  )
              }

          fun ringRotation(t: Float): Float =
              if (t < 0.6f) sin(t / 0.6f * 8f * PI.toFloat()) * 14f else 0f

          // ---------- Activity ----------

          object AppEvents {
              var tick by mutableIntStateOf(0)
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  setContent { Launcher() }
              }

              override fun onResume() {
                  super.onResume()
                  NotifService.silenceRequested = true // opening the launcher silences the battery beep
                  AppEvents.tick++ // refresh app list (e.g. after an uninstall)
              }
          }

          // ---------- Data ----------

          data class AppItem(
              val label: String,
              val pkg: String,
              val icon: ImageBitmap,
              val folder: String,
              val removable: Boolean
          )

          data class ScreenData(val name: String, val apps: List<String>)

          data class WeatherInfo(val temp: String, val cond: String, val place: String)

          class WeatherState(private val prefs: SharedPreferences) {
              var city by mutableStateOf(prefs.getString("w_city", "") ?: "")
              var useF by mutableStateOf(prefs.getBoolean("w_f", true))
              var temp by mutableStateOf("—")
              var cond by mutableStateOf("")
              var place by mutableStateOf("")

              fun update(newCity: String, f: Boolean) {
                  city = newCity.trim()
                  useF = f
                  prefs.edit().putString("w_city", city).putBoolean("w_f", f).apply()
              }
          }

          // Everything an icon needs to know, passed as one object.
          data class UiEnv(
              val counts: Map<String, Int>,
              val ringing: Set<String>,
              val editing: Boolean,
              val shine: () -> Float,
              val wiggle: () -> Float,
              val ring: () -> Float,
              val onLaunch: (AppItem) -> Unit,
              val onEdit: () -> Unit,
              val onUninstall: (AppItem) -> Unit,
              val onRemove: ((AppItem) -> Unit)?
          )

          val FOLDERS = listOf("Work", "Entertainment", "Games", "Other")

          private val WORK_HINTS = listOf(
              "office", "slack", "teams", "zoom", "docs", "sheets", "slides", "drive", "calendar",
              "outlook", "notion", "trello", "excel", "powerpoint", "onedrive", "dropbox", "mail"
          )
          private val FUN_HINTS = listOf(
              "youtube", "netflix", "spotify", "tiktok", "instagram", "facebook", "twitch", "hulu",
              "disney", "music", "video", "snapchat", "reddit", "twitter", "pinterest", "prime"
          )

          fun folderFor(ai: ApplicationInfo, pkg: String): String {
              @Suppress("DEPRECATION")
              val isGame = ai.category == ApplicationInfo.CATEGORY_GAME ||
                  (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0
              if (isGame) return "Games"
              when (ai.category) {
                  ApplicationInfo.CATEGORY_PRODUCTIVITY -> return "Work"
                  ApplicationInfo.CATEGORY_AUDIO,
                  ApplicationInfo.CATEGORY_VIDEO,
                  ApplicationInfo.CATEGORY_IMAGE,
                  ApplicationInfo.CATEGORY_SOCIAL,
                  ApplicationInfo.CATEGORY_NEWS -> return "Entertainment"
              }
              val p = pkg.lowercase()
              if (WORK_HINTS.any { p.contains(it) } || p.endsWith(".gm")) return "Work"
              if (FUN_HINTS.any { p.contains(it) }) return "Entertainment"
              return "Other"
          }

          private val iconCache = HashMap<String, ImageBitmap>()

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(intent, 0)
                  .filter { it.activityInfo.packageName != ctx.packageName }
                  .distinctBy { it.activityInfo.packageName }
                  .map { ri ->
                      val pkg = ri.activityInfo.packageName
                      val ai = ri.activityInfo.applicationInfo
                      val system = (ai.flags and ApplicationInfo.FLAG_SYSTEM) != 0 &&
                          (ai.flags and ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0
                      AppItem(
                          ri.loadLabel(pm).toString(),
                          pkg,
                          iconCache.getOrPut(pkg) { ri.loadIcon(pm).toBitmap(192, 192).asImageBitmap() },
                          folderFor(ai, pkg),
                          !system
                      )
                  }
                  .sortedBy { it.label.lowercase() }
          }

          fun defaultDock(ctx: Context, apps: List<AppItem>): List<AppItem> {
              val pm = ctx.packageManager
              val intents = listOf(
                  Intent(Intent.ACTION_DIAL),
                  Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:")),
                  Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")),
                  Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
              )
              val picked = intents
                  .mapNotNull { i -> pm.resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName }
                  .mapNotNull { p -> apps.find { it.pkg == p } }
                  .distinct()
              return (picked + apps.filter { it !in picked }).take(4)
          }

          fun loadScreens(prefs: SharedPreferences): List<ScreenData> {
              val raw = prefs.getString("screens", null) ?: return listOf(ScreenData("Screen 1", emptyList()))
              return try {
                  val arr = JSONArray(raw)
                  (0 until arr.length()).map { i ->
                      val o = arr.getJSONObject(i)
                      val a = o.getJSONArray("apps")
                      ScreenData(o.getString("name"), (0 until a.length()).map { a.getString(it) })
                  }
              } catch (e: Exception) {
                  listOf(ScreenData("Screen 1", emptyList()))
              }
          }

          fun saveScreens(prefs: SharedPreferences, list: List<ScreenData>) {
              val arr = JSONArray()
              list.forEach { s -> arr.put(JSONObject().put("name", s.name).put("apps", JSONArray(s.apps))) }
              prefs.edit().putString("screens", arr.toString()).apply()
          }

          fun isListenerOn(ctx: Context): Boolean =
              NotificationManagerCompat.getEnabledListenerPackages(ctx).contains(ctx.packageName)

          fun pullShade(ctx: Context, quickSettings: Boolean) {
              val svc = ShadeService.instance
              if (svc == null) {
                  ctx.startActivity(
                      Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
                  return
              }
              svc.performGlobalAction(
                  if (quickSettings) AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS
                  else AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS
              )
          }

          // ---------- Weather (Open-Meteo, free, no key) ----------

          fun httpGet(url: String): String {
              val c = URL(url).openConnection() as HttpURLConnection
              c.connectTimeout = 8000
              c.readTimeout = 8000
              return try {
                  c.inputStream.bufferedReader().use { it.readText() }
              } finally {
                  c.disconnect()
              }
          }

          fun weatherText(code: Int): String = when (code) {
              0 -> "Clear"
              1, 2 -> "Mostly clear"
              3 -> "Cloudy"
              45, 48 -> "Fog"
              in 51..57 -> "Drizzle"
              in 61..67 -> "Rain"
              in 71..77 -> "Snow"
              in 80..82 -> "Showers"
              85, 86 -> "Snow showers"
              in 95..99 -> "Thunderstorm"
              else -> "—"
          }

          fun fetchWeather(city: String, f: Boolean): WeatherInfo {
              val q = URLEncoder.encode(city, "UTF-8")
              val geo = JSONObject(httpGet("https://geocoding-api.open-meteo.com/v1/search?name=$q&count=1"))
              val results = geo.optJSONArray("results") ?: return WeatherInfo("—", "City not found", city)
              val first = results.getJSONObject(0)
              val lat = first.getDouble("latitude")
              val lon = first.getDouble("longitude")
              val unit = if (f) "fahrenheit" else "celsius"
              val w = JSONObject(
                  httpGet(
                      "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon" +
                          "&current=temperature_2m,weather_code&temperature_unit=$unit"
                  )
              )
              val cur = w.getJSONObject("current")
              val t = cur.getDouble("temperature_2m").roundToInt()
              return WeatherInfo(
                  "$t°" + if (f) "F" else "C",
                  weatherText(cur.getInt("weather_code")),
                  first.optString("name", city)
              )
          }

          // ---------- Root ----------

          @Composable
          fun Launcher() {
              val ctx = LocalContext.current
              val haptic = LocalHapticFeedback.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("fold", Context.MODE_PRIVATE) }

              val tick = AppEvents.tick
              val apps = remember(tick) { loadApps(ctx) }
              val dock = remember(apps) { defaultDock(ctx, apps) }
              val folders = remember(apps) { FOLDERS.associateWith { n -> apps.filter { it.folder == n } } }
              val counts = remember {
                  mutableStateMapOf<String, Int>().apply {
                      apps.forEach { a ->
                          val c = prefs.getInt("c_${a.pkg}", 0)
                          if (c > 0) put(a.pkg, c)
                      }
                  }
              }
              val screens = remember { mutableStateListOf<ScreenData>().apply { addAll(loadScreens(prefs)) } }
              val weather = remember { WeatherState(prefs) }

              val wide = LocalConfiguration.current.screenWidthDp >= 600
              val columns = if (wide) 8 else 4
              val iconSize = if (wide) 60.dp else 48.dp

              var editing by remember { mutableStateOf(false) }
              var openFolder by remember { mutableStateOf<String?>(null) }
              var pickerFor by remember { mutableStateOf<Int?>(null) }
              var weatherEditing by remember { mutableStateOf(false) }

              BackHandler(editing) { editing = false }
              BackHandler(openFolder != null) { openFolder = null }
              BackHandler(pickerFor != null) { pickerFor = null }
              BackHandler(weatherEditing) { weatherEditing = false }

              // Shared animations (only read at draw time, so no constant recomposition).
              val inf = rememberInfiniteTransition(label = "fx")
              val shineAnim = inf.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(
                      keyframes {
                          durationMillis = 2000
                          0f at 0 using LinearEasing
                          1f at 700
                      }
                  ),
                  label = "shine"
              )
              val wiggleAnim = inf.animateFloat(
                  initialValue = -1f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(120, easing = LinearEasing), RepeatMode.Reverse),
                  label = "wiggle"
              )
              val ringAnim = inf.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(1400, easing = LinearEasing)),
                  label = "ring"
              )

              LaunchedEffect(weather.city, weather.useF) {
                  if (weather.city.isBlank()) {
                      weather.temp = "—"
                      weather.cond = "Tap to set city"
                      weather.place = ""
                      return@LaunchedEffect
                  }
                  while (true) {
                      try {
                          val r = withContext(Dispatchers.IO) { fetchWeather(weather.city, weather.useF) }
                          weather.temp = r.temp
                          weather.cond = r.cond
                          weather.place = r.place
                      } catch (e: Exception) {
                          weather.cond = "Weather unavailable"
                      }
                      delay(30 * 60 * 1000L)
                  }
              }

              var listenerOn by remember { mutableStateOf(isListenerOn(ctx)) }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(2000)
                      listenerOn = isListenerOn(ctx)
                  }
              }

              val ui = UiEnv(
                  counts = NotifState.counts,
                  ringing = NotifState.ringing,
                  editing = editing,
                  shine = { shineAnim.value },
                  wiggle = { wiggleAnim.value },
                  ring = { ringAnim.value },
                  onLaunch = { a ->
                      val n = (counts[a.pkg] ?: 0) + 1
                      counts[a.pkg] = n
                      prefs.edit().putInt("c_${a.pkg}", n).apply()
                      ctx.packageManager.getLaunchIntentForPackage(a.pkg)?.let { ctx.startActivity(it) }
                  },
                  onEdit = {
                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                      editing = true
                  },
                  onUninstall = { a ->
                      ctx.startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:${a.pkg}")))
                  },
                  onRemove = null
              )

              val ranked = apps.sortedByDescending { counts[it.pkg] ?: 0 }
              val pager = rememberPagerState { 2 + screens.size }

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(
                              listOf(Color(0x66000A1E), Color(0x1A000000), Color(0x8C000A1E))
                          )
                      )
                      .drawBehind {
                          drawRect(
                              Brush.radialGradient(
                                  listOf(NeonCyan.copy(alpha = 0.16f), Color.Transparent),
                                  center = Offset(0f, 0f),
                                  radius = size.maxDimension * 0.7f
                              )
                          )
                          drawRect(
                              Brush.radialGradient(
                                  listOf(NeonViolet.copy(alpha = 0.18f), Color.Transparent),
                                  center = Offset(size.width, size.height),
                                  radius = size.maxDimension * 0.7f
                              )
                          )
                      }
              ) {
                  val maxW = constraints.maxWidth.toFloat()
                  val maxH = constraints.maxHeight.toFloat()

                  Row(
                      Modifier
                          .fillMaxSize()
                          .systemBarsPadding()
                          .padding(horizontal = 14.dp, vertical = 8.dp)
                  ) {
                      Column(Modifier.weight(1f).fillMaxHeight()) {
                          if (!listenerOn) {
                              GlassPill("Tap to turn on notification badges") {
                                  ctx.startActivity(
                                      Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)
                                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  )
                              }
                              Spacer(Modifier.height(6.dp))
                          }
                          if (editing) {
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  GlassPill("Done", selected = true) { editing = false }
                                  GlassPill("+ Screen") {
                                      screens.add(ScreenData("Screen ${screens.size + 1}", emptyList()))
                                      saveScreens(prefs, screens)
                                      scope.launch {
                                          delay(150)
                                          pager.animateScrollToPage(screens.size)
                                      }
                                  }
                              }
                              Spacer(Modifier.height(6.dp))
                          }
                          HorizontalPager(pager, Modifier.weight(1f)) { page ->
                              when {
                                  page == 0 -> HomePage(
                                      ranked.take(columns * 4), columns, iconSize, wide, ui, weather
                                  ) { weatherEditing = true }

                                  page <= screens.size -> {
                                      val s = screens.getOrNull(page - 1)
                                      if (s != null) {
                                          ScreenPage(
                                              s, apps, columns, iconSize, ui,
                                              onRemoveApp = { a ->
                                                  val i = page - 1
                                                  if (i in screens.indices) {
                                                      screens[i] = screens[i].copy(apps = screens[i].apps - a.pkg)
                                                      saveScreens(prefs, screens)
                                                  }
                                              },
                                              onAdd = { pickerFor = page - 1 },
                                              onDelete = {
                                                  val i = page - 1
                                                  if (i in screens.indices) {
                                                      screens.removeAt(i)
                                                      saveScreens(prefs, screens)
                                                  }
                                              }
                                          )
                                      }
                                  }

                                  else -> FolderPage(folders, wide, ui) { openFolder = it }
                              }
                          }
                          Row(
                              Modifier.fillMaxWidth().padding(top = 6.dp),
                              horizontalArrangement = Arrangement.Center
                          ) {
                              repeat(2 + screens.size) { i ->
                                  Box(
                                      Modifier
                                          .padding(3.dp)
                                          .size(7.dp)
                                          .clip(CircleShape)
                                          .background(
                                              if (pager.currentPage == i) NeonCyan
                                              else Color.White.copy(alpha = 0.35f)
                                          )
                                  )
                              }
                          }
                      }
                      Spacer(Modifier.width(10.dp))
                      SideDock(dock, if (wide) 54.dp else 42.dp, ui)
                  }

                  ShadeButton(maxW, maxH, prefs)

                  openFolder?.let { name ->
                      FolderOverlay(name, folders[name].orEmpty(), wide, ui) { openFolder = null }
                  }
                  pickerFor?.let { idx ->
                      val s = screens.getOrNull(idx)
                      if (s != null) {
                          AppPicker(
                              "Add to ${s.name}", apps, s.apps,
                              onToggle = { a ->
                                  val cur = screens[idx]
                                  screens[idx] = cur.copy(
                                      apps = if (a.pkg in cur.apps) cur.apps - a.pkg else cur.apps + a.pkg
                                  )
                                  saveScreens(prefs, screens)
                              },
                              onClose = { pickerFor = null }
                          )
                      }
                  }
                  if (weatherEditing) {
                      WeatherEditor(weather) { weatherEditing = false }
                  }
              }
          }


          // Replaces the phone's top bar: time + one ring showing battery (arc), Wi-Fi (center), Bluetooth (dots).
          @Composable
          fun StatusCluster(modifier: Modifier = Modifier) {
              val ctx = LocalContext.current
              var time by remember { mutableStateOf("") }
              var battery by remember { mutableIntStateOf(100) }
              var charging by remember { mutableStateOf(false) }
              var wifi by remember { mutableStateOf(false) }
              var bt by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) {
                  val bm = ctx.getSystemService(BatteryManager::class.java)
                  val cm = ctx.getSystemService(ConnectivityManager::class.java)
                  val fmt = SimpleDateFormat("h:mm", Locale.getDefault())
                  while (true) {
                      time = fmt.format(Date())
                      try {
                          battery = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                          charging = bm.isCharging
                      } catch (e: Exception) {
                      }
                      wifi = try {
                          cm.getNetworkCapabilities(cm.activeNetwork)
                              ?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                      } catch (e: Exception) {
                          false
                      }
                      bt = try {
                          Settings.Global.getInt(ctx.contentResolver, "bluetooth_on", 0) == 1
                      } catch (e: Exception) {
                          false
                      }
                      delay(5000)
                  }
              }
              Row(modifier, verticalAlignment = Alignment.CenterVertically) {
                  Text(
                      time, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.SemiBold,
                      modifier = Modifier.clickable { pullShade(ctx, false) }.padding(end = 10.dp)
                  )
                  StatusRing(
                      battery, charging, wifi, bt,
                      Modifier.size(width = 30.dp, height = 36.dp).clickable { pullShade(ctx, true) }
                  )
              }
          }

          @Composable
          fun StatusRing(battery: Int, charging: Boolean, wifi: Boolean, bt: Boolean, modifier: Modifier = Modifier) {
              val color = when {
                  charging -> Ok
                  battery <= 10 -> Danger
                  else -> Color.White
              }
              Canvas(modifier) {
                  val s = size.width
                  val stroke = s * 0.09f
                  val ring = Size(s - stroke, s - stroke)
                  val tl = Offset(stroke / 2f, stroke / 2f)
                  drawArc(
                      Color.White.copy(alpha = 0.25f), 125f, 290f, false, tl, ring,
                      style = Stroke(stroke, cap = StrokeCap.Round)
                  )
                  drawArc(
                      color, 125f, 290f * battery.coerceIn(0, 100) / 100f, false, tl, ring,
                      style = Stroke(stroke, cap = StrokeCap.Round)
                  )
                  val cx = s / 2f
                  val cy = s * 0.6f
                  val wc = Color.White.copy(alpha = if (wifi) 1f else 0.3f)
                  listOf(0.12f, 0.22f, 0.32f).forEach { f ->
                      val r = s * f
                      drawArc(
                          wc, 225f, 90f, false, Offset(cx - r, cy - r), Size(r * 2f, r * 2f),
                          style = Stroke(s * 0.065f, cap = StrokeCap.Round)
                      )
                  }
                  drawCircle(wc, s * 0.04f, Offset(cx, cy))
                  val dc = Color.White.copy(alpha = if (bt) 1f else 0.3f)
                  for (i in 0 until 4) {
                      drawCircle(dc, s * 0.04f, Offset(cx + (i - 1.5f) * s * 0.14f, s * 1.12f))
                  }
              }
          }

          // Double swipe up on the bottom bar: cards for recently used apps. Swipe a card up to close it.
          @Composable
          fun RecentsOverlay(
              ctx: Context, apps: List<AppItem>, dismissedAt: MutableMap<String, Long>,
              onOpen: (AppItem) -> Unit, onClose: () -> Unit
          ) {
              val tick = AppEvents.tick
              val granted = remember(tick) { hasUsageAccess(ctx) }
              val list = remember(granted, tick) { if (granted) recentApps(ctx, apps) else emptyList() }
              val visible = list.filter { it.time > (dismissedAt[it.app.pkg] ?: 0L) }

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .background(Color.Black.copy(alpha = 0.62f))
                      .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {
                          onClose()
                      }
              ) {
                  if (!granted) {
                      Column(
                          Modifier
                              .align(Alignment.Center)
                              .fillMaxWidth(0.85f)
                              .glass(RoundedCornerShape(28.dp))
                              .background(Color(0xFF0B1226).copy(alpha = 0.7f))
                              .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {}
                              .padding(22.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Text(
                              "To list your recent apps, allow usage access for FoldLauncher.",
                              color = Color.White, fontSize = 15.sp
                          )
                          GlassPill("Open settings", selected = true) {
                              ctx.startActivity(
                                  Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          }
                      }
                  } else if (visible.isEmpty()) {
                      Text(
                          "No recent apps",
                          color = Color.White.copy(alpha = 0.75f), fontSize = 16.sp,
                          modifier = Modifier.align(Alignment.Center)
                      )
                  } else {
                      val cardW = minOf(maxWidth * 0.6f, 300.dp)
                      val cardH = maxHeight * 0.58f
                      val state = rememberPagerState { visible.size }
                      HorizontalPager(
                          state,
                          Modifier.align(Alignment.Center).fillMaxWidth().height(cardH + 64.dp),
                          contentPadding = PaddingValues(horizontal = (maxWidth - cardW) / 2),
                          pageSize = PageSize.Fixed(cardW),
                          pageSpacing = 14.dp,
                          key = { i -> visible.getOrNull(i)?.app?.pkg ?: i }
                      ) { i ->
                          val r = visible.getOrNull(i)
                          if (r != null) {
                              RecentCard(
                                  r, cardH,
                                  onOpen = { onOpen(r.app) },
                                  onDismiss = {
                                      try {
                                          ctx.getSystemService(ActivityManager::class.java)
                                              .killBackgroundProcesses(r.app.pkg)
                                      } catch (e: Exception) {
                                      }
                                      dismissedAt[r.app.pkg] = System.currentTimeMillis()
                                  }
                              )
                          }
                      }
                      Text(
                          "Swipe a card up to close the app",
                          color = Color.White.copy(alpha = 0.6f), fontSize = 12.sp,
                          modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 90.dp)
                      )
                  }
              }
          }

          @Composable
          fun RecentCard(r: RecentApp, cardH: Dp, onOpen: () -> Unit, onDismiss: () -> Unit) {
              val scope = rememberCoroutineScope()
              var offY by remember { mutableFloatStateOf(0f) }
              Column(
                  Modifier
                      .graphicsLayer {
                          translationY = offY
                          alpha = (1f + offY / 900f).coerceIn(0f, 1f)
                      }
                      .pointerInput(r.app.pkg) {
                          detectVerticalDragGestures(
                              onDragEnd = {
                                  if (offY < -120.dp.toPx()) {
                                      scope.launch {
                                          animate(offY, -2200f, animationSpec = tween(200)) { v, _ -> offY = v }
                                          onDismiss()
                                      }
                                  } else {
                                      scope.launch {
                                          animate(offY, 0f, animationSpec = spring()) { v, _ -> offY = v }
                                      }
                                  }
                              },
                              onDragCancel = {
                                  scope.launch {
                                      animate(offY, 0f, animationSpec = spring()) { v, _ -> offY = v }
                                  }
                              }
                          ) { change, dy ->
                              change.consume()
                              offY = minOf(0f, offY + dy)
                          }
                      }
              ) {
                  Row(
                      Modifier.padding(start = 6.dp, bottom = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Image(r.app.icon, null, Modifier.size(24.dp).clip(RoundedCornerShape(6.dp)))
                      Spacer(Modifier.width(8.dp))
                      Text(r.app.label, color = Color.White, fontSize = 14.sp, maxLines = 1)
                  }
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(cardH)
                          .glass(RoundedCornerShape(28.dp))
                          .background(Color(0xFF0B1226).copy(alpha = 0.55f))
                          .clickable { onOpen() },
                      contentAlignment = Alignment.Center
                  ) {
                      Image(
                          r.app.icon, r.app.label,
                          Modifier.size(96.dp).clip(RoundedCornerShape(22.dp))
                      )
                  }
              }
          }

          @Composable
          fun WeatherEditor(weather: WeatherState, onClose: () -> Unit) {
              var city by remember { mutableStateOf(weather.city) }
              var f by remember { mutableStateOf(weather.useF) }
              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Color.Black.copy(alpha = 0.6f))
                      .clickable { onClose() },
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      Modifier
                          .fillMaxWidth(0.9f)
                          .widthIn(max = 460.dp)
                          .glass(RoundedCornerShape(30.dp))
                          .background(Color(0xFF0B1226).copy(alpha = 0.78f))
                          .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {}
                          .padding(20.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      SectionLabel("Edit weather")
                      Box(
                          Modifier
                              .fillMaxWidth()
                              .glass(RoundedCornerShape(16.dp))
                              .padding(horizontal = 14.dp, vertical = 12.dp)
                      ) {
                          if (city.isEmpty()) {
                              Text("City name", color = Color.White.copy(alpha = 0.5f), fontSize = 18.sp)
                          }
                          BasicTextField(
                              value = city,
                              onValueChange = { city = it },
                              singleLine = true,
                              textStyle = TextStyle(color = Color.White, fontSize = 18.sp),
                              cursorBrush = SolidColor(NeonCyan),
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          GlassPill("°F", selected = f) { f = true }
                          GlassPill("°C", selected = !f) { f = false }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          GlassPill("Cancel") { onClose() }
                          GlassPill("Save", selected = true) {
                              weather.update(city, f)
                              onClose()
                          }
                      }
                  }
              }
          }

          // Draggable round buttons. quick=false opens notifications, quick=true opens the control panel.
          @Composable
          fun FloatingButton(
              maxW: Float, maxH: Float, prefs: SharedPreferences,
              key: String, icon: String, quick: Boolean, slot: Int
          ) {
              val ctx = LocalContext.current
              val d = LocalDensity.current
              val sizePx = with(d) { 52.dp.toPx() }
              val defX = maxW - sizePx - with(d) { 16.dp.toPx() }
              val defY = (maxH / 2f + with(d) { 150.dp.toPx() } + slot * with(d) { 60.dp.toPx() })
                  .coerceAtMost(maxH - sizePx - with(d) { 100.dp.toPx() })
              var x by remember { mutableFloatStateOf(prefs.getFloat(key + "x", defX)) }
              var y by remember { mutableFloatStateOf(prefs.getFloat(key + "y", defY)) }

              Box(
                  Modifier
                      .offset { IntOffset(x.roundToInt(), y.roundToInt()) }
                      .size(52.dp)
                      .glass(CircleShape)
                      .pointerInput(Unit) {
                          detectTapGestures(onTap = { pullShade(ctx, quick) })
                      }
                      .pointerInput(maxW, maxH) {
                          detectDragGestures(
                              onDragEnd = {
                                  prefs.edit().putFloat(key + "x", x).putFloat(key + "y", y).apply()
                              }
                          ) { change, drag ->
                              change.consume()
                              x = (x + drag.x).coerceIn(0f, maxW - sizePx)
                              y = (y + drag.y).coerceIn(0f, maxH - sizePx)
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Text(icon, fontSize = 20.sp)
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/foldlauncher/Services.kt <<'EOF_FILE'
          package com.example.foldlauncher

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.telecom.TelecomManager
          import android.view.accessibility.AccessibilityEvent
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.core.content.ContextCompat

          // Live notification info shared with the launcher UI.
          object NotifState {
              var counts by mutableStateOf<Map<String, Int>>(emptyMap())   // package -> badge number
              var ringing by mutableStateOf<Set<String>>(emptySet())       // packages with an incoming call
          }

          class NotifService : NotificationListenerService() {
              private val handler = Handler(Looper.getMainLooper())
              private var alerted = false
              private var beeps = 0
              private var tone: ToneGenerator? = null

              private val beeper = object : Runnable {
                  override fun run() {
                      // Stops after ~27 seconds, when the launcher is opened, or when charging starts.
                      if (silenceRequested || beeps >= 45) {
                          stopBeeping()
                          return
                      }
                      tone?.startTone(ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK, 350)
                      beeps++
                      handler.postDelayed(this, 600)
                  }
              }

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      val level = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                      val scale = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                      if (level < 0 || scale <= 0) return
                      val pct = level * 100 / scale
                      val status = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                      val charging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                          status == BatteryManager.BATTERY_STATUS_FULL
                      if (charging || pct > 10) {
                          alerted = false
                          stopBeeping()
                      } else if (!alerted) {
                          alerted = true
                          postBatteryNotification(pct)
                          startBeeping()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  ContextCompat.registerReceiver(
                      this, batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
              }

              override fun onDestroy() {
                  try { unregisterReceiver(batteryReceiver) } catch (e: Exception) {}
                  stopBeeping()
                  super.onDestroy()
              }

              private fun startBeeping() {
                  stopBeeping()
                  silenceRequested = false
                  beeps = 0
                  tone = try {
                      ToneGenerator(AudioManager.STREAM_ALARM, 100)
                  } catch (e: RuntimeException) {
                      null
                  }
                  handler.post(beeper)
              }

              private fun stopBeeping() {
                  handler.removeCallbacks(beeper)
                  tone?.release()
                  tone = null
              }

              private fun postBatteryNotification(pct: Int) {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("battery", "Battery alert", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  nm.notify(
                      1,
                      Notification.Builder(this, "battery")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_low_battery)
                          .setContentTitle("Battery at $pct%")
                          .setContentText("Plug in your charger.")
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                  )
              }

              private fun refresh() {
                  val dialer = try {
                      getSystemService(TelecomManager::class.java)?.defaultDialerPackage
                  } catch (e: Exception) {
                      null
                  }
                  val counts = HashMap<String, Int>()
                  val ringing = HashSet<String>()
                  val list = (try { activeNotifications } catch (e: Exception) { null })
                      ?: emptyArray<StatusBarNotification>()
                  for (sbn in list) {
                      val n = sbn.notification
                      val cat = n.category
                      val isCall = cat == "call" || cat == "missed_call" ||
                          sbn.packageName.contains("incallui") || sbn.packageName.contains("telecom")
                      // Call notifications are credited to the phone app's icon.
                      val pkg = if (isCall && dialer != null) dialer else sbn.packageName
                      if (cat == "call") {
                          val extras = n.extras
                          val chrono = extras?.getBoolean(Notification.EXTRA_SHOW_CHRONOMETER, false) ?: false
                          val type = extras?.getInt("android.callType", 0) ?: 0
                          // Incoming (not yet answered): call type 1, or no running timer.
                          if (type == 1 || (type == 0 && !chrono)) ringing.add(pkg)
                          continue
                      }
                      if (sbn.isOngoing) continue
                      if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) continue
                      val c = if (n.number > 0) n.number else 1
                      counts[pkg] = (counts[pkg] ?: 0) + c
                  }
                  NotifState.counts = counts
                  NotifState.ringing = ringing
              }

              override fun onListenerConnected() { refresh() }
              override fun onNotificationPosted(sbn: StatusBarNotification?) { refresh() }
              override fun onNotificationRemoved(sbn: StatusBarNotification?) { refresh() }

              companion object {
                  @Volatile var silenceRequested = false
              }
          }

          // Lets the launcher's bell button open the notification shade / quick settings.
          class ShadeService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              companion object {
                  @Volatile var instance: ShadeService? = null
              }
          }
          EOF_FILE

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoldLauncher.apk
          gh release create "build-${{ github.run_number }}" FoldLauncher.apk --title "FoldLauncher build ${{ github.run_number }}" --notes "Debug build"

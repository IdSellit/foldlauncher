          @Composable
          fun StatusRing(battery: Int, charging: Boolean, wifi: Boolean, bt: Boolean, modifier: Modifier = Modifier) {
              val color = when {
                  charging -> Ok
                  battery <= 10 -> Danger
                  else -> Color.White
              }
              Canvas(modifier) {
                  val s = size.width
                  val stroke = s * 0.09f
                  val ring = Size(s - stroke, s - stroke)
                  val tl = Offset(stroke / 2f, stroke / 2f)
                  drawArc(
                      Color.White.copy(alpha = 0.25f), 125f, 290f, false, tl, ring,
                      style = Stroke(stroke, cap = StrokeCap.Round)
                  )
                  drawArc(
                      color, 125f, 290f * battery.coerceIn(0, 100) / 100f, false, tl, ring,
                      style = Stroke(stroke, cap = StrokeCap.Round)
                  )
                  val cx = s / 2f
                  val cy = s * 0.6f
                  val wc = Color.White.copy(alpha = if (wifi) 1f else 0.3f)
                  listOf(0.12f, 0.22f, 0.32f).forEach { f ->
                      val r = s * f
                      drawArc(
                          wc, 225f, 90f, false, Offset(cx - r, cy - r), Size(r * 2f, r * 2f),
                          style = Stroke(s * 0.065f, cap = StrokeCap.Round)
                      )
                  }
                  drawCircle(wc, s * 0.04f, Offset(cx, cy))
                  val dc = Color.White.copy(alpha = if (bt) 1f else 0.3f)
                  for (i in 0 until 4) {
                      drawCircle(dc, s * 0.04f, Offset(cx + (i - 1.5f) * s * 0.14f, s * 1.12f))
                  }
              }
          }

          // Double swipe up on the bottom bar: cards for recently used apps. Swipe a card up to close it.
          @Composable
          fun RecentsOverlay(
              ctx: Context, apps: List<AppItem>, dismissedAt: MutableMap<String, Long>,
              onOpen: (AppItem) -> Unit, onClose: () -> Unit
          ) {
              val tick = AppEvents.tick
              val granted = remember(tick) { hasUsageAccess(ctx) }
              val list = remember(granted, tick) { if (granted) recentApps(ctx, apps) else emptyList() }
              val visible = list.filter { it.time > (dismissedAt[it.app.pkg] ?: 0L) }

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .background(Color.Black.copy(alpha = 0.62f))
                      .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {
                          onClose()
                      }
              ) {
                  if (!granted) {
                      Column(
                          Modifier
                              .align(Alignment.Center)
                              .fillMaxWidth(0.85f)
                              .glass(RoundedCornerShape(28.dp))
                              .background(Color(0xFF0B1226).copy(alpha = 0.7f))
                              .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {}
                              .padding(22.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Text(
                              "To list your recent apps, allow usage access for FoldLauncher.",
                              color = Color.White, fontSize = 15.sp
                          )
                          GlassPill("Open settings", selected = true) {
                              ctx.startActivity(
                                  Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          }
                      }
                  } else if (visible.isEmpty()) {
                      Text(
                          "No recent apps",
                          color = Color.White.copy(alpha = 0.75f), fontSize = 16.sp,
                          modifier = Modifier.align(Alignment.Center)
                      )
                  } else {
                      val cardW = minOf(maxWidth * 0.6f, 300.dp)
                      val cardH = maxHeight * 0.58f
                      val state = rememberPagerState { visible.size }
                      HorizontalPager(
                          state,
                          Modifier.align(Alignment.Center).fillMaxWidth().height(cardH + 64.dp),
                          contentPadding = PaddingValues(horizontal = (maxWidth - cardW) / 2),
                          pageSize = PageSize.Fixed(cardW),
                          pageSpacing = 14.dp,
                          key = { i -> visible.getOrNull(i)?.app?.pkg ?: i }
                      ) { i ->
                          val r = visible.getOrNull(i)
                          if (r != null) {
                              RecentCard(
                                  r, cardH,
                                  onOpen = { onOpen(r.app) },
                                  onDismiss = {
                                      try {
                                          ctx.getSystemService(ActivityManager::class.java)
                                              .killBackgroundProcesses(r.app.pkg)
                                      } catch (e: Exception) {
                                      }
                                      dismissedAt[r.app.pkg] = System.currentTimeMillis()
                                  }
                              )
                          }
                      }                          if (type == 1 || (type == 0 && !chrono)) ringing.add(pkg)
                          continue
                      }
                      if (sbn.isOngoing) continue
                      if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) continue
                      val c = if (n.number > 0) n.number else 1
                      counts[pkg] = (counts[pkg] ?: 0) + c
                  }
                  NotifState.counts = counts
                  NotifState.ringing = ringing
              }

              override fun onListenerConnected() { refresh() }
              override fun onNotificationPosted(sbn: StatusBarNotification?) { refresh() }
              override fun onNotificationRemoved(sbn: StatusBarNotification?) { refresh() }

              companion object {
                  @Volatile var silenceRequested = false
              }
          }

          // Lets the launcher's bell button open the notification shade / quick settings.
          class ShadeService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              companion object {
                  @Volatile var instance: ShadeService? = null
              }
          }

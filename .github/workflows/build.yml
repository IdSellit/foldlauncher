          @Composable
          fun AppTile(app: AppItem, tileSize: Dp, ui: UiEnv, dockStyle: Boolean = false) {
              val cur = rememberUpdatedState(ui)
              var pressed by remember { mutableStateOf(false) }
              var origin by remember { mutableStateOf(Offset.Zero) }
              var boxSize by remember { mutableStateOf(IntSize.Zero) }
              val scale = animateFloatAsState(
                  if (pressed) 0.86f else 1f,
                  spring(dampingRatio = 0.45f, stiffness = 400f),
                  label = "press"
              )
              val count = ui.counts[app.pkg] ?: 0
              val ringing = app.pkg in ui.ringing
              val active = count > 0 || ringing
              val sign = if (app.pkg.hashCode() % 2 == 0) 1f else -1f
              val shape = RoundedCornerShape(tileSize * 0.225f) // iOS-style squircle

              Box(
                  Modifier
                      .onGloballyPositioned {
                          origin = it.positionInRoot()
                          boxSize = it.size
                      }
                      .graphicsLayer {
                          val u = cur.value
                          rotationZ = when {
                              u.editing -> u.wiggle() * 2.2f * sign
                              ringing -> ringRotation(u.ring())
                              else -> 0f
                          }
                          scaleX = scale.value
                          scaleY = scale.value
                      }
                      .pointerInput(app.pkg) {
                          detectTapGestures(
                              onPress = {
                                  pressed = true
                                  tryAwaitRelease()
                                  pressed = false
                              },
                              onTap = { if (!cur.value.editing) cur.value.onLaunch(app) },
                              onLongPress = {
                                  val u = cur.value
                                  if (!u.editing) {
                                      val remove = u.onRemove
                                      u.onMenu(
                                          MenuState(
                                              app,
                                              Offset(
                                                  origin.x + boxSize.width / 2f,
                                                  origin.y + boxSize.height.toFloat()
                                              ),
                                              remove?.let { r -> { r(app) } }
                                          )
                                      )
                                  }
                              }
                          )
                      }
                      .padding(6.dp)
              ) {
                  Box(
                      Modifier
                          .size(tileSize)
                          .shadow(4.dp, shape)
                          .shineEffect(active, ui.shine)
                          .ringGlow(ringing, ui.ring)
                  ) {
                      Image(app.icon, app.label, Modifier.fillMaxSize())
                  }

                  if (!ui.editing && count > 0) {
                      CountBadge(count, Modifier.align(Alignment.TopEnd).offset(x = 6.dp, y = (-6).dp))
                  }
              }
          }

          // iOS-style long-press menu.
          @Composable
          fun AppMenu(
              m: MenuState, maxW: Float, maxH: Float,
              onDismiss: () -> Unit, onEdit: () -> Unit, onUninstall: (AppItem) -> Unit
          ) {
              val d = LocalDensity.current
              val canRemove = m.onRemove != null
              val rowsShown = 1 + (if (canRemove) 1 else 0) + (if (m.app.removable) 1 else 0)
              val cardW = with(d) { 240.dp.toPx() }
              val cardH = with(d) { (52.dp * rowsShown + 12.dp).toPx() }
              val pad = with(d) { 8.dp.toPx() }
              val x = (m.anchor.x - cardW / 2f).coerceIn(pad, maxOf(pad, maxW - cardW - pad))
              var y = m.anchor.y + pad
              if (y + cardH > maxH - pad) y = (m.anchor.y - cardH - with(d) { 70.dp.toPx() }).coerceAtLeast(pad)

              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Color.Black.copy(alpha = 0.3f))
                      .clickable(indication = null, interactionSource = remember { MutableInteractionSource() }) {
                          onDismiss()
                      }
              ) {
                  Column(
                      Modifier
                          .offset { IntOffset(x.roundToInt(), y.roundToInt()) }
                          .width(240.dp)
                          .glass(RoundedCornerShape(22.dp))
                          .background(Color(0xFF0B1226).copy(alpha = 0.78f))
                          .padding(vertical = 6.dp)
                  ) {
                      var first = true
                      if (canRemove) {
                          MenuItem("⊖", "Remove from Screen", Danger) {
                              m.onRemove?.invoke()
                              onDismiss()
                          }
                          first = false
                      }
                      if (m.app.removable) {
                          if (!first) MenuDivider()
                          MenuItem("🗑", "Uninstall", Danger) {
                              onUninstall(m.app)
                              onDismiss()
                          }
                          first = false
                      }
                      if (!first) MenuDivider()
                      MenuItem("▦", "Edit Home Screen", Color.White) {
                          onEdit()
                          onDismiss()
                      }
                  }
              }
          }


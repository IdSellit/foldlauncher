          @Composable
          fun AppTile(app: AppItem, tileSize: Dp, ui: UiEnv, dockStyle: Boolean = false) {
              val cur = rememberUpdatedState(ui)
              var pressed by remember { mutableStateOf(false) }
              val scale = animateFloatAsState(
                  if (pressed) 0.86f else 1f,
                  spring(dampingRatio = 0.45f, stiffness = 400f),
                  label = "press"
              )
              val count = ui.counts[app.pkg] ?: 0
              val ringing = app.pkg in ui.ringing
              val active = count > 0 || ringing
              val sign = if (app.pkg.hashCode() % 2 == 0) 1f else -1f
              val shape = RoundedCornerShape(tileSize * 0.3f)

              Box(
                  Modifier
                      .graphicsLayer {
                          val u = cur.value
                          rotationZ = when {
                              u.editing -> u.wiggle() * 2.2f * sign
                              ringing -> ringRotation(u.ring())
                              else -> 0f
                          }
                          scaleX = scale.value
                          scaleY = scale.value
                      }
                      .pointerInput(app.pkg) {
                          detectTapGestures(
                              onPress = {
                                  pressed = true
                                  tryAwaitRelease()
                                  pressed = false
                              },
                              onTap = { if (!cur.value.editing) cur.value.onLaunch(app) },
                              onLongPress = { cur.value.onEdit() }
                          )
                      }
                      .padding(6.dp)
              ) {
                  if (dockStyle) {
                      Box(
                          Modifier
                              .size(tileSize)
                              .border(
                                  1.5.dp,
                                  Brush.linearGradient(listOf(Color.White, NeonCyan.copy(alpha = 0.6f))),
                                  shape
                              )
                              .clip(shape)
                              .shineEffect(active, ui.shine)
                              .ringGlow(ringing, ui.ring)
                              .padding(tileSize * 0.2f),
                          contentAlignment = Alignment.Center
                      ) {
                          Image(
                              app.icon, app.label, Modifier.fillMaxSize(),
                              colorFilter = ColorFilter.tint(Color.White)
                          )
                      }
                  } else {
                      Box(
                          Modifier
                              .size(tileSize)
                              .glass(shape)
                              .shineEffect(active, ui.shine)
                              .ringGlow(ringing, ui.ring),
                          contentAlignment = Alignment.Center
                      ) {
                          Image(
                              app.icon, app.label,
                              Modifier.size(tileSize * 0.72f).clip(RoundedCornerShape(tileSize * 0.2f))
                          )
                      }
                  }

                  if (ui.editing) {
                      if (app.removable) {
                          EditBadge(
                              "✕", Danger, { cur.value.onUninstall(app) },
                              Modifier.align(Alignment.TopEnd).offset(x = 6.dp, y = (-6).dp)
                          )
                      }
                      if (ui.onRemove != null) {
                          EditBadge(
                              "−", Slate, { cur.value.onRemove?.invoke(app) },
                              Modifier.align(Alignment.TopStart).offset(x = (-6).dp, y = (-6).dp)
                          )
                      }
                  } else if (count > 0) {
                      CountBadge(count, Modifier.align(Alignment.TopEnd).offset(x = 6.dp, y = (-6).dp))
                  }
              }
          }


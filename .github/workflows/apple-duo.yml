name: Build Apple Duo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip newest project zip
        run: |
          ZIP=$(ls apple-duo-*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Assemble debug APK
        working-directory: proj
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apple-duo-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
